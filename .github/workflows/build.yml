name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Préparer la clé de signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Renvoyer le journal de compilation (branche ci-log)
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          {
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "signed: ${{ env.KEYSTORE_BASE64 != '' }}"
          } > "$RUNNER_TEMP/log/status.txt"
          if [ -f build-log.txt ]; then
            grep -nE "^e: |error:|FAILURE|What went wrong|Could not|BUILD (SUCCESSFUL|FAILED)" build-log.txt | head -n 200 > "$RUNNER_TEMP/log/errors.txt" || true
            tail -n 300 build-log.txt > "$RUNNER_TEMP/log/build-log.txt"
          fi
          cd "$RUNNER_TEMP/log"
          git init -q
          git checkout -q -b ci-log
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Journal de la compilation ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      - name: Garder l'APK dans les artefacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: corsa-launcher
          path: app/build/outputs/apk/release/*.apk

      - name: Publier la version (seulement si l'APK est signé avec ta clé)
        if: steps.build.outcome == 'success' && env.KEYSTORE_BASE64 != ''
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk corsa-launcher.apk

      - name: Créer la release GitHub
        id: release
        if: steps.build.outcome == 'success' && env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Corsa Launcher 0.1.${{ github.run_number }}
          files: corsa-launcher.apk
          make_latest: "true"
          body: |
            Télécharger sur l'autoradio : ouvre https://github.com/${{ github.repository }}/releases/latest/download/corsa-launcher.apk
            puis installe le fichier par-dessus la version précédente.

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer l'APK compilé
        uses: actions/download-artifact@v4
        with:
          name: corsa-launcher
          path: apk

      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prendre les captures sur un émulateur Android (1280 x 720)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/screenshots.sh

      - name: Publier les captures (branche screenshots)
        if: always()
        shell: bash
        run: |
          mkdir -p shots
          echo "run: ${{ github.run_number }}" > shots/status.txt
          echo "commit: ${{ github.sha }}" >> shots/status.txt
          cd shots
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Captures de la compilation ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
